services:
  agroveterinaria-gross-web-prototipo02:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroveterinaria-gross-web-prototipo02
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      NEXT_TELEMETRY_DISABLED: 1

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - proxy
      - db

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      - traefik.http.routers.agroveterinaria-gross-prototipo02.rule=Host(`agroveterinariagross-prototipo02.${DOMAIN_NAME:-zubuagency.com}`)
      - traefik.http.routers.agroveterinaria-gross-prototipo02.entrypoints=websecure
      - traefik.http.routers.agroveterinaria-gross-prototipo02.tls=true
      - traefik.http.routers.agroveterinaria-gross-prototipo02.tls.certresolver=mytlschallenge
      - traefik.http.routers.agroveterinaria-gross-prototipo02.priority=10

      - traefik.http.services.agroveterinaria-gross-prototipo02.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
  db:
    external: true
    name: ${DB_NETWORK:-n8n_default}